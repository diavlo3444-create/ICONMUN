name: Validate ICON MUN site

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/all-six-site-upgrades]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
